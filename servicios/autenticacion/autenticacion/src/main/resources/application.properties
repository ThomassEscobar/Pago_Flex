server.port=8081
spring.application.name=autenticacion

# Conexion a PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/bd_autenticacion
spring.datasource.username=usuario_autenticacion
spring.datasource.password=cambiar_auth_123
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway (para crear las tablas automaticamente)
spring.flyway.enabled=true

# Correo (MailHog)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Rutas de las llaves JWT (dentro de resources)
pagoflex.jwt.clave-privada=classpath:certs/jwt-privada.pem
pagoflex.jwt.clave-publica=classpath:certs/jwt-publica.pem
pagoflex.jwt.emisor=pagoflex-autenticacion
pagoflex.jwt.minutos-acceso=15