services:
  postgres:
    image: postgres:16-alpine
    container_name: pagoflex-postgres
    environment:
      POSTGRES_USER: admin_postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./infraestructura/bd/inicializar:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks: [red-interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: pagoflex-mailhog
    ports:
      - "8025:8025"
    networks: [red-interna]

networks:
  red-interna:
    driver: bridge

volumes:
  datos-postgres: